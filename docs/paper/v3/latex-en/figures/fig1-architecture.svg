<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="100%" role="img"><text x="0.0" y="14.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="12.5" fill="#1a1a18" text-anchor="start" font-weight="600">Fig. 1. Reallocation decision flow and the learning/operation split</text><rect x="8.0" y="88.0" width="132.00" height="62.00" fill="#ffffff" stroke="#d5d6d2" rx="4"/><text x="74.0" y="114.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="12" fill="#1a1a18" text-anchor="middle" font-weight="600">Observe</text><text x="74.0" y="132.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="8.6" fill="#57575a" text-anchor="middle" font-weight="400">block congestion, public ETA</text><path d="M144 119 L159 119" fill="none" stroke="#1c3a63" stroke-width="1.4" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M159 119 l-5 -4 v8 z" fill="#1c3a63" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><rect x="164.0" y="88.0" width="132.00" height="62.00" fill="#1c3a63" stroke="#1c3a63" rx="4"/><text x="230.0" y="114.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Proposal</text><text x="230.0" y="132.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="8.6" fill="#c8d4e4" text-anchor="middle" font-weight="400">argmin of predicted cost</text><path d="M300 119 L315 119" fill="none" stroke="#1c3a63" stroke-width="1.4" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M315 119 l-5 -4 v8 z" fill="#1c3a63" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><rect x="320.0" y="88.0" width="132.00" height="62.00" fill="#1c3a63" stroke="#1c3a63" rx="4"/><text x="386.0" y="114.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Acceptance</text><text x="386.0" y="132.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="8.6" fill="#c8d4e4" text-anchor="middle" font-weight="400">accept vs. reject</text><path d="M456 119 L471 119" fill="none" stroke="#1c3a63" stroke-width="1.4" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M471 119 l-5 -4 v8 z" fill="#1c3a63" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><rect x="476.0" y="88.0" width="132.00" height="62.00" fill="#ffffff" stroke="#d5d6d2" rx="4"/><text x="542.0" y="114.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="12" fill="#1a1a18" text-anchor="middle" font-weight="600">Commit</text><text x="542.0" y="132.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="8.6" fill="#57575a" text-anchor="middle" font-weight="400">consent + capacity, applied at once</text><path d="M612 119 L627 119" fill="none" stroke="#1c3a63" stroke-width="1.4" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M627 119 l-5 -4 v8 z" fill="#1c3a63" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><rect x="632.0" y="88.0" width="132.00" height="62.00" fill="#ffffff" stroke="#d5d6d2" rx="4"/><text x="698.0" y="114.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="12" fill="#1a1a18" text-anchor="middle" font-weight="600">Execute</text><text x="698.0" y="132.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="8.6" fill="#57575a" text-anchor="middle" font-weight="400">yard and crane state update</text><text x="8.0" y="76.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="10" fill="#57575a" text-anchor="start" font-weight="500">Operating path — trained networks only, zero counterfactual calls</text><rect x="8.0" y="182.0" width="756.00" height="62.00" fill="#f2f3f1" stroke="#d5d6d2" rx="4"/><text x="22.0" y="206.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="10.5" fill="#1a1a18" text-anchor="start" font-weight="600">Learning path — clone state and random stream, run up to three worlds for 3 h</text><text x="22.0" y="225.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="9.6" fill="#57575a" text-anchor="start" font-weight="400">observed / proposal reversed / acceptance reversed  →  centred Φ difference as target</text><path d="M230.0 150 L230.0 182" fill="none" stroke="#9aa0a8" stroke-width="1.1" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M386.0 150 L386.0 182" fill="none" stroke="#9aa0a8" stroke-width="1.1" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="8.0" y="290.0" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif" font-size="9.2" fill="#8a8d93" text-anchor="start" font-weight="400">Only the cost difference produced in training enters the policy; operation invokes no branch simulation.</text></svg>